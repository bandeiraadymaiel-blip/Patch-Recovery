name: RECOVERY

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'RECOVERY URL'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

    # =========================
    # 1. CHECKOUT
    # =========================
    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # 2. DEPENDÊNCIAS + MAGISKBOOT
    # =========================
    - name: Setup environment
      run: |
        set -e
        sudo apt update
        sudo apt install -y git wget lz4 tar openssl python3 cpio file

        echo "Downloading magiskboot..."
        wget -O magiskboot https://github.com/topjohnwu/Magisk/releases/latest/download/magiskboot
        chmod +x magiskboot

        echo "Testing magiskboot..."
        ./magiskboot || true

    # =========================
    # 3. DOWNLOAD RECOVERY
    # =========================
    - name: Download recovery
      run: |
        set -e
        wget "${{ github.event.inputs.RECOVERY_URL }}" -O recovery.img
        ls -lah
        file recovery.img

    # =========================
    # 4. UNPACK IMAGE (FIXED)
    # =========================
    - name: Unpack recovery
      run: |
        set -e

        echo "=== UNPACK START ==="
        ./magiskboot unpack recovery.img || {
          echo "❌ magiskboot unpack failed"
          exit 1
        }

        echo "=== AFTER UNPACK ==="
        ls -lah

        mkdir -p fs

        if [ -f ramdisk.cpio ]; then
          ./magiskboot cpio ramdisk.cpio extract -o fs
        elif [ -f ramdisk ]; then
          ./magiskboot cpio ramdisk extract -o fs
        else
          echo "❌ RAMDISK NOT FOUND"
          exit 1
        fi

        echo "=== RAMDISK STRUCTURE ==="
        find fs | head -200

    # =========================
    # 5. PATCH STEP 1
    # =========================
    - name: Patch Process 1
      run: |
        set -e
        chmod +x script1.sh
        ./script1.sh recovery.img

    # =========================
    # 6. PATCH STEP 2
    # =========================
    - name: Patch Process 2
      run: |
        set -e
        chmod +x script2.sh
        ./script2.sh fs

        echo "=== OUTPUT CHECK ==="
        ls -lah

        test -f recovery-patched.img || {
          echo "❌ PATCH FAILED"
          exit 1
        }

    # =========================
    # 7. AVB SIGNING
    # =========================
    - name: AVB signing
      run: |
        set -e

        python3 avbtool extract_public_key \
          --key phh.pem \
          --output phh.pub.bin

        python3 avbtool add_hash_footer \
          --partition_name recovery \
          --partition_size $(wc -c recovery-patched.img | cut -f1 -d' ') \
          --image recovery-patched.img \
          --key phh.pem \
          --algorithm SHA256_RSA4096

    # =========================
    # 8. PACKAGE FOR ODIN
    # =========================
    - name: Package Odin
      run: |
        set -e

        mkdir -p output
        mv recovery-patched.img output/recovery.img

        cd output
        tar cvf recovery.tar recovery.img
        md5sum -t recovery.tar >> recovery.tar
        mv recovery.tar recovery.tar.md5

    # =========================
    # 9. RELEASE
    # =========================
    - name: Upload release
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.md5
        tag_name: ${{ github.run_id }}
