name: RECOVERY

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'RECOVERY URL'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y wget lz4 cpio file tar openssl python3

    - name: Download recovery
      run: |
        wget "${{ github.event.inputs.RECOVERY_URL }}" -O r.img
        file r.img

    - name: FIX IMAGE FORMAT (IMPORTANT)
      run: |
        echo "Checking format..."

        TYPE=$(file r.img)

        echo "$TYPE"

        if echo "$TYPE" | grep -i "lz4"; then
          echo "LZ4 detected"
          lz4 -d r.img r_fixed.img
          IMG=r_fixed.img
        elif echo "$TYPE" | grep -i "sparse"; then
          echo "Sparse detected"
          sudo apt install -y android-sdk-libsparse-utils
          simg2img r.img r_fixed.img
          IMG=r_fixed.img
        else
          echo "Assuming raw boot image"
          IMG=r.img
        fi

        echo "Using image: $IMG"
        echo $IMG > img.txt

    - name: Unpack boot image
      run: |
        IMG=$(cat img.txt)

        mkdir -p fs

        ./magiskboot unpack "$IMG" || {
          echo "ERROR: magiskboot failed"
          exit 1
        }

        echo "Checking ramdisk..."
        ls -lah

        if [ -f ramdisk.cpio ]; then
          ./magiskboot cpio ramdisk.cpio extract -o fs
        elif [ -f ramdisk ]; then
          ./magiskboot cpio ramdisk extract -o fs
        else
          echo "No ramdisk found"
          exit 1
        fi

        find fs | head -200

    - name: Patch Process
      run: |
        chmod +x script2.sh
        ./script2.sh fs

    - name: Build Odin package
      run: |
        mkdir -p output

        if [ -f recovery-patched.img ]; then
          mv recovery-patched.img output/recovery.img
        else
          echo "ERROR: no output image"
          exit 1
        fi

        cd output
        tar cvf recovery.tar recovery.img
        md5sum -t recovery.tar >> recovery.tar
        mv recovery.tar recovery.tar.md5

    - name: Upload
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.md5
        tag_name: ${{ github.run_id }}
